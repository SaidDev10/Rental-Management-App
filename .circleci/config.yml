version: 2.1

jobs:
  verify:
    docker:
      - image: cimg/node:24.22.0
    environment:
      PNPM_HOME: /home/circleci/.local/share/pnpm
    steps:
      - checkout
      - run:
          name: Install pinned pnpm
          command: |
            curl -fsSL https://get.pnpm.io/install.sh | SHELL="$(which bash)" bash -
            echo 'export PATH="$PNPM_HOME/bin:$PATH"' >> "$BASH_ENV"
            "$PNPM_HOME/bin/pnpm" config set store-dir ~/.pnpm-store
      - restore_cache:
          keys:
            - pnpm-v1-{{ checksum "pnpm-lock.yaml" }}
            - pnpm-v1-
      - run:
          name: Install dependencies
          command: pnpm install --frozen-lockfile
      - save_cache:
          key: pnpm-v1-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - ~/.pnpm-store
      - run:
          name: Typecheck
          command: pnpm typecheck
      - run:
          name: Lint
          command: pnpm lint
      - run:
          name: Unit tests
          command: pnpm test
      - run:
          name: Build Lambda artifacts
          command: pnpm build

workflows:
  backend:
    jobs:
      - verify
